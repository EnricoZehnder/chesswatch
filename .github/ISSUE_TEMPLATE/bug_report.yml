name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options: [Website, Windows, macOS, Linux, iPhone / iPad]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.0.0
  - type: textarea
    id: pgn
    attributes:
      label: PGN or screenshot (optional)
      description: Use "Copy PGN" in the app and paste it here if the bug is about a game.
