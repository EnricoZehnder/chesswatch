name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release for the version in package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmd: dist:win
          - name: macOS
            os: macos-latest
            cmd: dist:mac
          - name: Linux
            os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswatch-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: npm ci
      - run: npx cap sync ios
      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app Payload/Chesswatch.app
          VERSION=$(node -p "require('./package.json').version")
          zip -qry "Chesswatch-$VERSION-iOS-unsigned.ipa" Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswatch-iOS
          path: '*.ipa'
          if-no-files-found: error

  web:
    name: Web (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the website
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd web && zip -qr "../Chesswatch-$VERSION-Web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Chesswatch-Web
          path: '*.zip'
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [desktop, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Chesswatch ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          files: out/*
